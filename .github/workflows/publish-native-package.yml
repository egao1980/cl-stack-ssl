# Reusable workflow: publish a Lisp package + native-library overlays to GHCR.
#
# Caller builds natives and uploads artifacts named native-<os>-<arch>, then:
#
#   publish:
#     needs: build
#     uses: egao1980/cl-repository/.github/workflows/publish-native-package.yml@<ref>
#     with:
#       package-name: cl-stack-ssl
#       version: 3.4.1
#       depends-on: cl+ssl
#       cffi-libraries: libssl libcrypto
#       source-paths: |
#         cl-stack-ssl.asd
#         src
#         LICENSE
#         README.md
#         NOTICE
#     secrets: inherit
#     permissions:
#       packages: write
#       contents: read
#
name: Publish native OCI package

on:
  workflow_call:
    inputs:
      package-name:
        description: ASDF / OCI system name
        required: true
        type: string
      version:
        description: Package version tag
        required: true
        type: string
      registry:
        description: OCI registry host
        required: false
        type: string
        default: ghcr.io
      namespace:
        description: Registry namespace (default <owner>/cl-systems)
        required: false
        type: string
        default: ""
      description:
        description: Package description
        required: false
        type: string
        default: ""
      license:
        description: SPDX / short license id
        required: false
        type: string
        default: MIT
      depends-on:
        description: Space-separated ASDF dependencies
        required: false
        type: string
        default: ""
      provides:
        description: Space-separated provides (default package-name)
        required: false
        type: string
        default: ""
      cffi-libraries:
        description: Space-separated cffi library labels for config blob
        required: false
        type: string
        default: ""
      source-paths:
        description: Newline- or comma-separated paths to stage (Lisp-only)
        required: true
        type: string
      packager-tag:
        description: cl-repository-packager OCI tag
        required: false
        type: string
        default: "0.8.0"
      skip-catalog:
        description: Skip shared namespace catalog write
        required: false
        type: boolean
        default: true
      artifact-download-path:
        description: Where download-artifact places native-* dirs
        required: false
        type: string
        default: native-artifacts
      ci-ref:
        description: cl-repository git ref for scripts/ci helpers
        required: false
        type: string
        default: main
    secrets:
      # Optional override; prefer secrets: inherit (uses github.token)
      PUBLISH_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Apply synced source overlay
        uses: actions/download-artifact@v4
        with:
          name: synced-source
          path: ${{ github.workspace }}

      - name: Checkout cl-repository CI scripts
        uses: actions/checkout@v4
        with:
          repository: egao1980/cl-repository
          ref: ${{ inputs.ci-ref }}
          path: .cl-repository-ci
          sparse-checkout: |
            scripts/ci
          sparse-checkout-cone-mode: false

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ inputs.artifact-download-path }}

      - name: Arrange lib/<os>-<arch>
        run: |
          chmod +x .cl-repository-ci/scripts/ci/arrange-native-artifacts.sh
          .cl-repository-ci/scripts/ci/arrange-native-artifacts.sh \
            "$GITHUB_WORKSPACE" \
            "${{ inputs.artifact-download-path }}" \
            /tmp/platforms.txt

      - name: Stage Lisp-only source tree
        run: |
          chmod +x .cl-repository-ci/scripts/ci/stage-lisp-source.sh
          STAGING="${RUNNER_TEMP}/${{ inputs.package-name }}-src"
          .cl-repository-ci/scripts/ci/stage-lisp-source.sh \
            "$GITHUB_WORKSPACE" \
            "$STAGING" \
            "${{ inputs.source-paths }}"
          echo "STAGING=$STAGING" >> "$GITHUB_ENV"
          echo "LIB_ROOT=${GITHUB_WORKSPACE}/lib" >> "$GITHUB_ENV"

      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install Quicklisp
        run: |
          curl -fsSL -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --noinform --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install :path #p"~/quicklisp/")'
          sbcl --noinform --non-interactive \
            --load ~/quicklisp/setup.lisp \
            --eval '(ql-util:without-prompting (ql:add-to-init-file))'

      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.3

      - name: Pull cl-repository-packager
        run: |
          CL_REPO_TAG="${{ inputs.packager-tag }}"
          CL_REPO_IMAGE="ghcr.io/egao1980/cl-repository/cl-repository-packager"
          rm -rf /tmp/cl-repo-pull
          mkdir -p /tmp/cl-repo-pull ~/.local/share/cl-systems
          rm -rf ~/.local/share/cl-systems/cl-oci-*
          oras pull "${CL_REPO_IMAGE}:${CL_REPO_TAG}" -o /tmp/cl-repo-pull/
          for f in /tmp/cl-repo-pull/*.tar.gz; do
            tar -xzf "$f" -C ~/.local/share/cl-systems/
          done

      - name: Publish package + overlays
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
          PKG_NAME: ${{ inputs.package-name }}
          PKG_VERSION: ${{ inputs.version }}
          PKG_DESCRIPTION: ${{ inputs.description }}
          PKG_LICENSE: ${{ inputs.license }}
          PKG_DEPENDS_ON: ${{ inputs.depends-on }}
          PKG_PROVIDES: ${{ inputs.provides }}
          PKG_CFFI_LIBS: ${{ inputs.cffi-libraries }}
          SKIP_CATALOG: ${{ inputs.skip-catalog }}
        run: |
          REGISTRY="${{ inputs.registry }}"
          NAMESPACE="${{ inputs.namespace }}"
          if [ -z "$NAMESPACE" ]; then
            NAMESPACE="${{ github.repository_owner }}/cl-systems"
          fi
          NAMESPACE=$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')
          if [ "$REGISTRY" = "ghcr.io" ]; then
            REGISTRY_URL="https://${REGISTRY}"
          else
            REGISTRY_URL="http://${REGISTRY}"
          fi

          PKG_SOURCE_DIR="$STAGING" \
          LIB_ROOT="$LIB_ROOT" \
          PLATFORMS_FILE=/tmp/platforms.txt \
          OCI_REGISTRY="$REGISTRY" \
          REGISTRY_URL="$REGISTRY_URL" \
          OCI_NAMESPACE="$NAMESPACE" \
          GITHUB_ACTOR="${{ github.actor }}" \
          sbcl --noinform --non-interactive \
            --load .cl-repository-ci/scripts/ci/publish-native-package.lisp

          PROVIDES="${{ inputs.provides }}"
          if [ -n "$PROVIDES" ]; then
            PRIMARY_OCI_NAME="${PROVIDES%% *}"
          else
            PRIMARY_OCI_NAME="${{ inputs.package-name }}"
          fi

          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "NAMESPACE=$NAMESPACE" >> "$GITHUB_ENV"
          echo "PUBLISH_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          echo "PRIMARY_OCI_NAME=$PRIMARY_OCI_NAME" >> "$GITHUB_ENV"

      - name: Verify published index
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
        run: |
          oras manifest fetch \
            "${REGISTRY}/${NAMESPACE}/${PRIMARY_OCI_NAME}:${PUBLISH_VERSION}" \
            --registry-config <(echo "{\"auths\":{\"${REGISTRY}\":{\"username\":\"${{ github.actor }}\",\"password\":\"${GITHUB_TOKEN}\"}}}")
