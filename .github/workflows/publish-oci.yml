# Build OpenSSL shared libs (matrix) + publish via local reusable workflow.
name: Publish OCI Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package / OpenSSL version (input, else v* tag, else .asd :version; OpenSSL = first three parts)"
        required: false
        default: ""
      registry:
        description: "OCI registry (default: ghcr.io)"
        required: false
        default: "ghcr.io"

jobs:
  # Package version = OpenSSL version + package revision. Input, else the v*
  # tag, else the .asd :version; OpenSSL builds from the first three parts.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      openssl: ${{ steps.ver.outputs.openssl }}
    steps:
      - uses: actions/checkout@v5
      - id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ]; then
            V="$(sed -nE 's/^[[:space:]]*:version[[:space:]]+"([^"]+)".*/\1/p' cl-stack-ssl.asd | head -1)"
          fi
          [ -n "$V" ] || { echo "could not resolve package version" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "openssl=$(echo "$V" | cut -d. -f1-3)" >> "$GITHUB_OUTPUT"
          echo "package version=$V"

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          # Hosted Linux ARM label is ubuntu-24.04-arm (not -arm64).
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-latest
          # Hosted — self-hosted [overlay] runner is often offline; overlay-ci.md default.
          - os: windows
            arch: amd64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl perl patchelf

      - name: Install build deps (macOS)
        if: matrix.os == 'darwin'
        run: brew install perl || true

      - name: Build OpenSSL shared libs (Unix)
        if: matrix.os != 'windows'
        env:
          OPENSSL_VERSION: ${{ needs.resolve-version.outputs.openssl }}
        run: |
          chmod +x scripts/build-openssl.sh
          ./scripts/build-openssl.sh
          mkdir -p native-bundle
          cp -a "lib/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/

      - name: Install Strawberry Perl (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if (Get-Command perl -ErrorAction SilentlyContinue) {
            perl -v | Select-Object -First 2
            return
          }
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            throw "winget not found; install App Installer / Strawberry Perl manually"
          }
          winget install -e --id StrawberryPerl.StrawberryPerl `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          # Refresh PATH for this job (service runners often miss new Machine PATH).
          $machine = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $user = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machine;$user"
          foreach ($p in @(
            "C:\Strawberry\perl\bin",
            "C:\Strawberry\c\bin"
          )) {
            if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) {
              $env:Path = "$p;$env:Path"
            }
          }
          Get-Command perl | Format-List
          perl -v | Select-Object -First 2

      - name: Build OpenSSL shared libs (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          OPENSSL_VERSION: ${{ needs.resolve-version.outputs.openssl }}
        run: |
          # Ensure Strawberry is visible even if install step was a no-op / cached.
          foreach ($p in @("C:\Strawberry\perl\bin", "C:\Strawberry\c\bin")) {
            if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) {
              $env:Path = "$p;$env:Path"
            }
          }
          .\scripts\build-openssl.ps1
          New-Item -ItemType Directory -Force -Path native-bundle | Out-Null
          Copy-Item -Path "lib\${{ matrix.os }}-${{ matrix.arch }}\*" -Destination native-bundle -Recurse -Force

      - name: Upload native artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: native-bundle/

  publish:
    needs: [build, resolve-version]
    permissions:
      contents: read
      packages: write
    uses: egao1980/cl-repository/.github/workflows/publish-native-package.yml@main
    with:
      package-name: cl-stack-ssl
      version: ${{ needs.resolve-version.outputs.version }}
      registry: ${{ inputs.registry || 'ghcr.io' }}
      source-paths: |
        cl-stack-ssl.asd
        src
        LICENSE
        README.md
        NOTICE
    secrets: inherit
